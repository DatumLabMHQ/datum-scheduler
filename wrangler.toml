name = "datum-scheduler"
main = "src/index.ts"
compatibility_date = "2026-01-01"
account_id = "c9bf3d8e875ffe933a9bf895695e0fd1"

# GitHub's own cron scheduler delays runs by hours under load (the hourly platform job ran four
# times in one night). This worker is the clock: on each tick it either dispatches the matching
# GitHub workflow, OR — for jobs whose workflow was just a curl — calls that endpoint directly,
# keeping those off GitHub runners entirely (no Actions minutes).
# Secrets (set with `wrangler secret put <NAME>`):
#   GITHUB_TOKEN       — fine-grained, Actions: write on the target repos (for dispatch jobs)
#   SETNEL_CRON_SECRET — key for the Hub cron endpoints (resolve/analyze/crosscheck)
[triggers]
# Workers Free allows 5 cron triggers per account and the RWA worker uses some, so this worker
# ticks once every 5 minutes and decides from the clock what is due (see PLAN in src/index.ts).
crons = ["*/5 * * * *"]
